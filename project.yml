name: Dave
options:
  bundleIdPrefix: com.jornjansen
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # The version, shared by the app and its widget
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "11"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Dave:
    type: application
    platform: iOS
    sources:
      - Dave
    dependencies:
      - target: DaveWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jornjansen.dave
        PRODUCT_NAME: Dave
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Dave/Info.plist
      properties:
        CFBundleDisplayName: Dave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: Dave listens to you when you tap the microphone.
        NSLocalNetworkUsageDescription: Dave talks to Dave on your PC.
        NSAppleMusicUsageDescription: Dave plays, pauses and skips your Apple Music when you ask him to.
        NSPhotoLibraryUsageDescription: Dave looks at your photos when you ask him to (like "what's in my last screenshot?").
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # dave-iphone://talk: the widget starts listening
        CFBundleURLTypes:
          - CFBundleURLName: com.jornjansen.dave
            CFBundleURLSchemes:
              - dave-iphone
        # "Open in Dave" for any file (from Files or another app): Dave sends it to the PC
        CFBundleDocumentTypes:
          - CFBundleTypeName: File
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
        LSSupportsOpeningDocumentsInPlace: false
  DaveWidget:
    type: app-extension
    platform: iOS
    sources:
      - DaveWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jornjansen.dave.widget
        PRODUCT_NAME: DaveWidget
    info:
      path: DaveWidget/Info.plist
      properties:
        CFBundleDisplayName: Dave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
