name: Dave
options:
  bundleIdPrefix: com.jornjansen
  deploymentTarget:
    iOS: "16.0"
targets:
  Dave:
    type: application
    platform: iOS
    sources:
      - Dave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jornjansen.dave
        PRODUCT_NAME: Dave
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: Dave/Info.plist
      properties:
        CFBundleDisplayName: Dave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: Dave listens to you when you tap the microphone.
        NSLocalNetworkUsageDescription: Dave talks to Dave on your PC.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
